<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAi</title>

    <!-- Иконка сайта (эмодзи) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

    <!-- Material 3 (Tailwind CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Иконки -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Markdown + XSS-санитайзер (пиннутые версии) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>

    <style>
        :root {
            --md-surface: #FEF7FF;
            --md-surface-variant: #E7E0EC;
            --md-primary: #6750A4;
            --md-on-primary: #FFFFFF;
            --md-on-surface: #1D1B20;
            --md-outline: #79747E;
            background-color: var(--md-surface);
            color: var(--md-on-surface);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --md-surface: #141218;
                --md-surface-variant: #49454F;
                --md-primary: #D0BCFF;
                --md-on-primary: #381E72;
                --md-on-surface: #E6E0E9;
                --md-outline: #938F99;
            }
        }
        body { margin: 0; height: 100vh; display: flex; overflow: hidden; }
        .bg-surface { background-color: var(--md-surface); }
        .bg-surface-variant { background-color: var(--md-surface-variant); }
        .bg-primary { background-color: var(--md-primary); color: var(--md-on-primary); }
        .text-primary { color: var(--md-primary); }
        .text-outline { color: var(--md-outline); }
        .border-outline { border-color: var(--md-outline); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: 10px; }

        input, textarea {
            background: transparent; border: none; outline: none;
            color: var(--md-on-surface); width: 100%; font-family: inherit;
        }
        input::placeholder, textarea::placeholder { color: var(--md-outline); opacity: 0.5; }
        textarea {
            resize: none;
            min-height: 200px;
            max-height: 60vh;
            overflow-y: auto;
            line-height: 1.6;
        }

        /* === Markdown preview (свой минимальный аналог prose, т.к. @tailwindcss/typography не в CDN) === */
        .markdown-body { line-height: 1.7; font-size: 1rem; cursor: text; }
        .markdown-body h1 { font-size: 1.75rem; font-weight: 700; margin: 1.5em 0 0.5em; }
        .markdown-body h2 { font-size: 1.4rem; font-weight: 700; margin: 1.3em 0 0.5em; }
        .markdown-body h3 { font-size: 1.15rem; font-weight: 600; margin: 1.1em 0 0.4em; }
        .markdown-body h4 { font-size: 1rem; font-weight: 600; margin: 1em 0 0.4em; }
        .markdown-body h1:first-child,
        .markdown-body h2:first-child,
        .markdown-body h3:first-child,
        .markdown-body h4:first-child { margin-top: 0; }
        .markdown-body p { margin: 0.75em 0; }
        .markdown-body ul,
        .markdown-body ol { padding-left: 1.5em; margin: 0.75em 0; }
        .markdown-body ul { list-style: disc; }
        .markdown-body ol { list-style: decimal; }
        .markdown-body li { margin: 0.25em 0; }
        .markdown-body code {
            background: var(--md-surface-variant);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.9em;
        }
        .markdown-body pre {
            background: var(--md-surface-variant);
            padding: 1em;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.75em 0;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            font-size: 0.85em;
            white-space: pre;
        }
        .markdown-body blockquote {
            border-left: 3px solid var(--md-primary);
            padding-left: 1em;
            margin: 0.75em 0;
            color: var(--md-outline);
            font-style: italic;
        }
        .markdown-body a { color: var(--md-primary); text-decoration: underline; }
        .markdown-body a:hover { opacity: 0.8; }
        .markdown-body hr { border: none; border-top: 1px solid var(--md-outline); opacity: 0.5; margin: 1.5em 0; }
        .markdown-body img { max-width: 100%; height: auto; border-radius: 6px; }
        .markdown-body table { border-collapse: collapse; margin: 0.75em 0; width: 100%; }
        .markdown-body th,
        .markdown-body td { border: 1px solid var(--md-outline); padding: 0.4em 0.7em; text-align: left; }
        .markdown-body th { background: var(--md-surface-variant); font-weight: 600; }

        /* Чек-боксы (GFM task list) — интерактивные, увеличены под Touch Target */
        .markdown-body input[type="checkbox"] {
            transform: scale(1.15);
            margin-right: 0.5em;
            cursor: pointer;
            vertical-align: middle;
        }
        .markdown-body li:has(input[type="checkbox"]) {
            list-style: none;
            margin-left: -1.5em;
        }
    </style>

    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-surface text-[var(--md-on-surface)]">

    <aside class="w-64 border-r border-[var(--md-outline)] flex-col hidden md:flex bg-[var(--md-surface-variant)]">
        <div class="p-4 flex justify-between items-center">
            <span class="font-bold text-lg text-primary">MAi</span>
            <button type="button" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5" aria-label="Настройки">
                <i data-lucide="settings" class="w-5 h-5 text-outline"></i>
            </button>
        </div>
        <div class="px-4 pb-4 flex-1 flex flex-col min-h-0">
            <button id="btn-new-note" type="button" class="w-full flex items-center justify-center gap-2 bg-primary p-3 min-h-[48px] rounded-xl mb-4 font-medium shadow-sm hover:opacity-90 transition-opacity">
                <i data-lucide="plus" class="w-4 h-4"></i> Новая заметка
            </button>
            <div class="text-xs font-bold text-outline uppercase tracking-wider mb-2 px-1">Заметки</div>
            <div id="notes-list" class="flex-1 flex flex-col gap-1 overflow-y-auto min-h-0" style="display:none;"></div>
            <div id="notes-empty" class="flex-1 flex items-center justify-center text-center text-sm text-outline italic px-4">
                Пока нет заметок.<br>Нажмите «+», чтобы создать.
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-surface">
        <header class="h-16 border-b border-[var(--md-outline)] flex items-center px-2 justify-between">
            <button type="button" class="w-12 h-12 flex items-center justify-center md:hidden rounded-full hover:bg-black/5" aria-label="Меню">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center gap-1">
                <span id="save-status" class="text-xs text-outline italic mr-2">Готово</span>
                <button id="btn-delete-note" type="button" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5" aria-label="Удалить заметку" title="Удалить заметку">
                    <i data-lucide="trash-2" class="w-5 h-5 text-outline"></i>
                </button>
                <button type="button" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5" aria-label="Поиск" disabled>
                    <i data-lucide="search" class="w-5 h-5 text-outline"></i>
                </button>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto p-6 md:p-10 max-w-3xl mx-auto w-full">
            <input id="note-title" type="text" placeholder="Заголовок заметки..." class="text-3xl font-bold mb-6">
            <textarea id="note-content" placeholder="Начните печатать свою мысль здесь..."></textarea>
            <div id="note-preview" class="markdown-body hidden"></div>
        </div>
    </main>

    <aside class="w-80 border-l border-[var(--md-outline)] hidden lg:flex flex-col bg-[var(--md-surface-variant)]">
        <div class="p-4 border-b border-[var(--md-outline)] font-bold text-sm text-outline uppercase flex items-center gap-2">
            <i data-lucide="sparkles" class="w-4 h-4 text-primary"></i> Gemini
        </div>
        <div class="flex-1 p-4 text-sm text-outline italic flex items-center justify-center text-center">
            Нажмите на чип, чтобы запустить ассистента.
        </div>
    </aside>

    <script>
        'use strict';

        // === STATE ===
        const state = {
            notes: [],
            activeId: null,
            saveTimeout: null,
            saveStatus: 'idle',   // 'idle' | 'saving' | 'saved' | 'error'
            editorMode: 'edit'    // 'edit' | 'preview'
        };

        const STORAGE_KEY = 'mai_notes';
        const LEGACY_TITLE_KEY = 'mai_title';
        const LEGACY_CONTENT_KEY = 'mai_content';

        // === DOM ELEMENTS ===
        const els = {
            notesList: document.getElementById('notes-list'),
            notesEmpty: document.getElementById('notes-empty'),
            btnNewNote: document.getElementById('btn-new-note'),
            btnDeleteNote: document.getElementById('btn-delete-note'),
            titleInput: document.getElementById('note-title'),
            contentInput: document.getElementById('note-content'),
            preview: document.getElementById('note-preview'),
            statusText: document.getElementById('save-status')
        };

        // === UTILS ===
        function genId() {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
                try { return crypto.randomUUID(); } catch (_) { /* fallback ниже */ }
            }
            return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function relativeTime(ts) {
            const diff = Date.now() - ts;
            if (diff < 60 * 1000) return 'только что';
            if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + ' мин назад';
            if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + ' ч назад';
            if (diff < 48 * 60 * 60 * 1000) return 'вчера';
            return new Date(ts).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        function getNoteById(id) {
            if (!id) return null;
            return state.notes.find(function (n) { return n.id === id; }) || null;
        }

        function isValidNote(n) {
            return n && typeof n === 'object'
                && typeof n.id === 'string'
                && typeof n.title === 'string'
                && typeof n.content === 'string'
                && typeof n.updatedAt === 'number'
                && (n.tags === undefined || Array.isArray(n.tags));
        }

        function sortedNotes() {
            return state.notes.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; });
        }

        function autoResizeTextarea() {
            const ta = els.contentInput;
            if (!ta || ta.classList.contains('hidden')) return;
            ta.style.height = 'auto';
            const max = Math.max(200, window.innerHeight * 0.6);
            ta.style.height = Math.min(ta.scrollHeight, max) + 'px';
        }

        function notePreview(note) {
            const firstLine = note.content.trim().split('\n')[0].trim();
            return firstLine ? firstLine.slice(0, 60) : 'Пустая заметка';
        }

        function noteTitle(note) {
            return note.title.trim() ? note.title : 'Без названия';
        }

        // === STORAGE ===
        function loadNotes() {
            let raw = null;
            try {
                raw = localStorage.getItem(STORAGE_KEY);
            } catch (e) {
                console.warn('localStorage недоступен (read):', e);
                return [];
            }

            if (raw !== null) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        return parsed
                            .filter(isValidNote)
                            .map(function (n) {
                                return {
                                    id: n.id,
                                    title: n.title,
                                    content: n.content,
                                    updatedAt: n.updatedAt,
                                    tags: Array.isArray(n.tags) ? n.tags : []
                                };
                            });
                    }
                } catch (e) {
                    console.warn('Повреждён ' + STORAGE_KEY + ', восстанавливаюсь:', e);
                }
                return [];
            }

            // Миграция legacy-ключей (mai_title / mai_content). Сами legacy-ключи НЕ удаляем.
            let legacyTitle = '';
            let legacyContent = '';
            try {
                legacyTitle = localStorage.getItem(LEGACY_TITLE_KEY) || '';
                legacyContent = localStorage.getItem(LEGACY_CONTENT_KEY) || '';
            } catch (e) {
                return [];
            }

            if (legacyTitle || legacyContent) {
                return [{
                    id: genId(),
                    title: legacyTitle || 'Без названия',
                    content: legacyContent,
                    updatedAt: Date.now(),
                    tags: []
                }];
            }

            return [];
        }

        function persistNotes() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes));
                return true;
            } catch (e) {
                console.error('persistNotes failed:', e);
                state.saveStatus = 'error';
                return false;
            }
        }

        // === MARKDOWN ===
        function renderMarkdown(text) {
            if (!text || !text.trim()) {
                els.preview.innerHTML = '';
                return;
            }

            if (typeof window.marked === 'undefined' || typeof window.DOMPurify === 'undefined') {
                // CDN упал — безопасный fallback без парсинга
                els.preview.innerHTML = '<p>' + escapeHtml(text) + '</p>';
                return;
            }

            try {
                const rawHtml = window.marked.parse(text, { gfm: true, breaks: true });
                const cleanHtml = window.DOMPurify.sanitize(rawHtml);
                els.preview.innerHTML = cleanHtml;

                // Все ссылки — в новой вкладке, без opener
                els.preview.querySelectorAll('a').forEach(function (a) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                });

                makeCheckboxesInteractive();
            } catch (e) {
                console.error('Markdown render error:', e);
                els.preview.innerHTML = '<p>' + escapeHtml(text) + '</p>';
            }
        }

        function makeCheckboxesInteractive() {
            const note = getNoteById(state.activeId);
            if (!note) return;

            const lines = note.content.split('\n');
            const taskLineIndices = [];
            for (let i = 0; i < lines.length; i++) {
                if (/^\s*[-*+]\s+\[[ xX]\]/.test(lines[i])) {
                    taskLineIndices.push(i);
                }
            }

            const checkboxes = els.preview.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(function (cb, i) {
                cb.removeAttribute('disabled');
                if (i >= taskLineIndices.length) return;

                const lineIdx = taskLineIndices[i];

                cb.addEventListener('change', function () {
                    const current = getNoteById(state.activeId);
                    if (!current) return;

                    const currLines = current.content.split('\n');
                    if (lineIdx >= currLines.length) return;

                    const line = currLines[lineIdx];
                    const newLine = cb.checked
                        ? line.replace(/\[ \]/, '[x]')
                        : line.replace(/\[[xX]\]/, '[ ]');

                    if (newLine === line) return;

                    currLines[lineIdx] = newLine;
                    current.content = currLines.join('\n');
                    current.updatedAt = Date.now();

                    state.saveStatus = 'saving';
                    renderSaveStatus();
                    scheduleSave();
                });
            });
        }

        function enterPreviewMode() {
            const note = getNoteById(state.activeId);
            if (!note) return;
            if (!note.content.trim()) return;       // пустую заметку в превью не гоним
            if (state.editorMode === 'preview') return;
            state.editorMode = 'preview';
            renderEditor();
        }

        function exitPreviewMode() {
            if (state.editorMode !== 'preview') return;
            state.editorMode = 'edit';
            renderEditor();
            try {
                els.contentInput.focus();
                const len = els.contentInput.value.length;
                els.contentInput.setSelectionRange(len, len);
            } catch (_) { /* noop */ }
        }

        function schedulePreview(noteIdAtBlur) {
            setTimeout(function () {
                if (state.activeId !== noteIdAtBlur) return;    // переключили заметку
                if (state.editorMode === 'preview') return;     // уже в превью
                const active = document.activeElement;
                if (active === els.titleInput || active === els.contentInput) return;
                if (els.preview.contains(active)) return;
                enterPreviewMode();
            }, 0);
        }

        // === RENDER ===
        function renderNotes() {
            const sorted = sortedNotes();

            if (sorted.length === 0) {
                els.notesList.innerHTML = '';
                els.notesList.style.display = 'none';
                els.notesEmpty.style.display = 'flex';
                return;
            }

            els.notesEmpty.style.display = 'none';
            els.notesList.style.display = 'flex';

            const html = sorted.map(function (note) {
                const isActive = note.id === state.activeId;
                const activeCls = isActive
                    ? 'bg-black/5 text-primary font-semibold'
                    : 'text-outline hover:bg-black/5';

                return '<button type="button" '
                    + 'class="note-item w-full text-left p-3 min-h-[48px] rounded-lg transition-colors ' + activeCls + '" '
                    + 'data-note-id="' + escapeHtml(note.id) + '">'
                    + '<div class="font-medium truncate text-sm">' + escapeHtml(noteTitle(note)) + '</div>'
                    + '<div class="text-xs truncate opacity-80 mt-0.5">' + escapeHtml(notePreview(note)) + '</div>'
                    + '<div class="text-[10px] opacity-60 mt-1">' + relativeTime(note.updatedAt) + '</div>'
                    + '</button>';
            }).join('');

            els.notesList.innerHTML = html;

            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        function updateActiveNoteInList() {
            if (!state.activeId) return;
            const note = getNoteById(state.activeId);
            if (!note) return;
            const btn = els.notesList.querySelector('[data-note-id="' + state.activeId + '"]');
            if (!btn || btn.children.length < 3) return;

            btn.children[0].textContent = noteTitle(note);
            btn.children[1].textContent = notePreview(note);
            btn.children[2].textContent = relativeTime(note.updatedAt);
        }

        function renderEditor() {
            const note = getNoteById(state.activeId);

            if (!note) {
                // Нет активной заметки — принудительно edit, пустые поля
                state.editorMode = 'edit';
                els.titleInput.value = '';
                els.contentInput.value = '';
                els.titleInput.placeholder = 'Выберите заметку или создайте новую';
                els.contentInput.placeholder = 'Здесь появится текст заметки...';
                els.contentInput.classList.remove('hidden');
                els.preview.classList.add('hidden');
                els.preview.innerHTML = '';
                autoResizeTextarea();
                return;
            }

            els.titleInput.value = note.title;
            els.contentInput.value = note.content;
            els.titleInput.placeholder = 'Заголовок заметки...';
            els.contentInput.placeholder = 'Начните печатать свою мысль здесь...';

            if (state.editorMode === 'preview') {
                els.contentInput.classList.add('hidden');
                els.preview.classList.remove('hidden');
                renderMarkdown(note.content);
            } else {
                els.contentInput.classList.remove('hidden');
                els.preview.classList.add('hidden');
                els.preview.innerHTML = '';
                autoResizeTextarea();
            }
        }

        function renderSaveStatus() {
            const map = {
                idle:   { text: 'Готово',            color: 'var(--md-outline)' },
                saving: { text: 'Сохранение...',     color: 'var(--md-primary)' },
                saved:  { text: 'Сохранено',         color: 'var(--md-outline)' },
                error:  { text: 'Ошибка сохранения', color: '#B3261E' }
            };
            const s = map[state.saveStatus] || map.idle;
            els.statusText.innerText = s.text;
            els.statusText.style.color = s.color;
        }

        function renderAll() {
            renderNotes();
            renderEditor();
            renderSaveStatus();
        }

        // === LOGIC ===
        function scheduleSave() {
            if (state.saveTimeout) clearTimeout(state.saveTimeout);
            state.saveTimeout = setTimeout(function () {
                state.saveTimeout = null;
                const ok = persistNotes();
                if (ok) state.saveStatus = 'saved';
                renderSaveStatus();
            }, 500);
        }

        function onEdit() {
            if (!state.activeId) return;
            const note = getNoteById(state.activeId);
            if (!note) return;

            note.title = els.titleInput.value;
            note.content = els.contentInput.value;
            note.updatedAt = Date.now();

            state.saveStatus = 'saving';
            renderSaveStatus();
            scheduleSave();
        }

        function createNote() {
            const note = {
                id: genId(),
                title: '',
                content: '',
                updatedAt: Date.now(),
                tags: []
            };
            state.notes.unshift(note);
            state.activeId = note.id;
            state.editorMode = 'edit';

            const ok = persistNotes();
            if (ok) state.saveStatus = 'idle';

            renderAll();
            try { els.titleInput.focus(); } catch (_) { /* noop */ }
        }

        function selectNote(id) {
            if (id === state.activeId) {
                // Клик по уже активной заметке из превью = вернуться в режим правки
                if (state.editorMode === 'preview') exitPreviewMode();
                return;
            }
            if (!getNoteById(id)) return;

            state.activeId = id;
            state.editorMode = 'edit';
            state.saveStatus = 'idle';
            renderAll();
        }

        function deleteNote(id) {
            const note = getNoteById(id);
            if (!note) return;

            const label = noteTitle(note);
            if (!window.confirm('Удалить заметку «' + label + '»?')) return;

            state.notes = state.notes.filter(function (n) { return n.id !== id; });

            if (state.activeId === id) {
                const sorted = sortedNotes();
                state.activeId = sorted.length > 0 ? sorted[0].id : null;
            }

            state.editorMode = 'edit';
            const ok = persistNotes();
            if (ok) state.saveStatus = 'idle';

            renderAll();
        }

        // === BOOTSTRAP ===
        function attachListeners() {
            els.btnNewNote.addEventListener('click', createNote);

            els.btnDeleteNote.addEventListener('click', function () {
                if (state.activeId) deleteNote(state.activeId);
            });

            els.notesList.addEventListener('click', function (e) {
                const btn = e.target.closest('[data-note-id]');
                if (!btn) return;
                selectNote(btn.getAttribute('data-note-id'));
            });

            els.titleInput.addEventListener('input', onEdit);
            els.contentInput.addEventListener('input', function () {
                autoResizeTextarea();
                onEdit();
            });

            // Blur → in-place обновление карточки в списке + попытка перейти в preview
            els.titleInput.addEventListener('blur', function () {
                updateActiveNoteInList();
            });
            els.contentInput.addEventListener('blur', function () {
                updateActiveNoteInList();
                schedulePreview(state.activeId);
            });

            // Клик по превью (не по ссылке / чек-боксу) → назад в edit
            els.preview.addEventListener('click', function (e) {
                const t = e.target;
                if (!t || typeof t.closest !== 'function') return;
                if (t.closest('a') || t.closest('input') || t.closest('button')) return;
                exitPreviewMode();
            });

            window.addEventListener('resize', autoResizeTextarea);

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('./sw.js')
                        .then(function (reg) { console.log('✅ SW MAi зарегистрирован:', reg.scope); })
                        .catch(function (err) { console.error('❌ Ошибка SW:', err); });
                });
            }
        }

        function init() {
            state.notes = loadNotes();

            // Если была миграция из legacy и mai_notes ещё нет — фиксируем новую структуру в хранилище.
            try {
                if (state.notes.length > 0 && localStorage.getItem(STORAGE_KEY) === null) {
                    persistNotes();
                }
            } catch (_) { /* noop */ }

            if (state.notes.length > 0) {
                state.activeId = sortedNotes()[0].id;
            }

            state.editorMode = 'edit';
            renderAll();
            attachListeners();

            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        init();
    </script>
</body>
</html>
