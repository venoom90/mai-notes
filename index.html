<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAi</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>

    <style>
        :root {
            --md-surface: #FEF7FF;
            --md-surface-variant: #E7E0EC;
            --md-primary: #6750A4;
            --md-on-primary: #FFFFFF;
            --md-on-surface: #1D1B20;
            --md-outline: #79747E;
            background-color: var(--md-surface);
            color: var(--md-on-surface);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --md-surface: #141218;
                --md-surface-variant: #49454F;
                --md-primary: #D0BCFF;
                --md-on-primary: #381E72;
                --md-on-surface: #E6E0E9;
                --md-outline: #938F99;
            }
        }
        body { margin: 0; height: 100vh; display: flex; overflow: hidden; }
        .bg-surface { background-color: var(--md-surface); }
        .bg-surface-variant { background-color: var(--md-surface-variant); }
        .bg-primary { background-color: var(--md-primary); color: var(--md-on-primary); }
        .text-primary { color: var(--md-primary); }
        .text-outline { color: var(--md-outline); }
        .border-outline { border-color: var(--md-outline); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: 10px; }

        input, textarea {
            background: transparent; border: none; outline: none;
            color: var(--md-on-surface); width: 100%; font-family: inherit;
        }
        input::placeholder, textarea::placeholder { color: var(--md-outline); opacity: 0.5; }
        textarea {
            resize: none;
            min-height: 200px;
            max-height: 60vh;
            overflow-y: auto;
            line-height: 1.6;
        }

        /* === Markdown preview === */
        .markdown-body { line-height: 1.7; font-size: 1rem; cursor: text; min-height: 200px; }
        .markdown-body h1 { font-size: 1.75rem; font-weight: 700; margin: 1.5em 0 0.5em; }
        .markdown-body h2 { font-size: 1.4rem; font-weight: 700; margin: 1.3em 0 0.5em; }
        .markdown-body h3 { font-size: 1.15rem; font-weight: 600; margin: 1.1em 0 0.4em; }
        .markdown-body h4 { font-size: 1rem; font-weight: 600; margin: 1em 0 0.4em; }
        .markdown-body h1:first-child,
        .markdown-body h2:first-child,
        .markdown-body h3:first-child,
        .markdown-body h4:first-child { margin-top: 0; }
        .markdown-body p { margin: 0.75em 0; }
        .markdown-body ul,
        .markdown-body ol { padding-left: 1.5em; margin: 0.75em 0; }
        .markdown-body ul { list-style: disc; }
        .markdown-body ol { list-style: decimal; }
        .markdown-body li { margin: 0.25em 0; }
        .markdown-body code {
            background: var(--md-surface-variant);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.9em;
        }
        .markdown-body pre {
            background: var(--md-surface-variant);
            padding: 1em;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.75em 0;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            font-size: 0.85em;
            white-space: pre;
        }
        .markdown-body blockquote {
            border-left: 3px solid var(--md-primary);
            padding-left: 1em;
            margin: 0.75em 0;
            color: var(--md-outline);
            font-style: italic;
        }
        .markdown-body a { color: var(--md-primary); text-decoration: underline; }
        .markdown-body a:hover { opacity: 0.8; }
        .markdown-body hr { border: none; border-top: 1px solid var(--md-outline); opacity: 0.5; margin: 1.5em 0; }
        .markdown-body img { max-width: 100%; height: auto; border-radius: 6px; }
        .markdown-body table { border-collapse: collapse; margin: 0.75em 0; width: 100%; }
        .markdown-body th,
        .markdown-body td { border: 1px solid var(--md-outline); padding: 0.4em 0.7em; text-align: left; }
        .markdown-body th { background: var(--md-surface-variant); font-weight: 600; }

        .markdown-body input[type="checkbox"] {
            transform: scale(1.15);
            margin-right: 0.5em;
            cursor: pointer;
            vertical-align: middle;
        }
        .markdown-body li:has(input[type="checkbox"]) {
            list-style: none;
            margin-left: -1.5em;
        }

        /* === Prompt chips === */
        .prompt-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.25em;
            background: var(--md-surface-variant);
            color: var(--md-primary);
            border-radius: 999px;
            padding: 0.15em 0.6em;
            font-size: 0.9em;
            line-height: 1.4;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: opacity 0.15s;
            vertical-align: middle;
        }
        .prompt-chip:hover { opacity: 0.8; }

        .prompt-chip-palette-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
            background: var(--md-surface-variant);
            color: var(--md-primary);
            border-radius: 999px;
            padding: 0.4em 0.85em;
            font-size: 0.85em;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: opacity 0.15s;
            min-height: 32px;
        }
        .prompt-chip-palette-btn:hover { opacity: 0.8; }

        /* === AI panel (aside) === */
        #ai-panel { display: none; flex-direction: column; }
        @media (min-width: 1024px) {
            #ai-panel { display: flex; }
        }
        @media (max-width: 1023px) {
            #ai-panel.mobile-active {
                display: flex;
                position: fixed;
                inset: 0;
                z-index: 50;
                width: 100%;
                max-width: 100%;
                border-left: none;
            }
        }

        /* === Folders === */
        .folder-item { transition: background-color 0.15s; border-radius: 8px; }
        .folder-item:hover { background: rgba(0,0,0,0.03); }
        .folder-item-active { background: rgba(0,0,0,0.05); }
        .folder-item-active .folder-name { font-weight: 600; color: var(--md-primary); }
        .folder-item-active .folder-select-btn > i { color: var(--md-primary); }
        .folder-action-btn { display: none; }
        .folder-item-active .folder-action-btn { display: inline-flex; }
    </style>

    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-surface text-[var(--md-on-surface)]">

    <aside class="w-64 border-r border-[var(--md-outline)] flex-col hidden md:flex bg-[var(--md-surface-variant)]">
        <div class="p-4 flex justify-between items-center">
            <span class="font-bold text-lg text-primary">MAi</span>
            <button type="button" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5" aria-label="Настройки">
                <i data-lucide="settings" class="w-5 h-5 text-outline"></i>
            </button>
        </div>
        <div class="px-4 pb-4 flex-1 flex flex-col min-h-0">

            <button id="btn-new-note" type="button" class="w-full flex items-center justify-center gap-2 bg-primary p-3 min-h-[48px] rounded-xl mb-4 font-medium shadow-sm hover:opacity-90 transition-opacity">
                <i data-lucide="plus" class="w-4 h-4"></i> Новая заметка
            </button>

            <div class="flex items-center justify-between px-1 mb-1">
                <div class="text-xs font-bold text-outline uppercase tracking-wider">Папки</div>
                <button id="btn-new-folder" type="button" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-black/5" aria-label="Новая папка" title="Новая папка">
                    <i data-lucide="folder-plus" class="w-4 h-4 text-outline"></i>
                </button>
            </div>
            <div id="folders-list" class="flex flex-col gap-0.5 mb-3 max-h-[220px] overflow-y-auto"></div>

            <div id="notes-section-label" class="text-xs font-bold text-outline uppercase tracking-wider mb-2 px-1">Заметки: Входящие</div>
            <div id="notes-list" class="flex-1 flex flex-col gap-1 overflow-y-auto min-h-0" style="display:none;"></div>
            <div id="notes-empty" class="flex-1 flex items-center justify-center text-center text-sm text-outline italic px-4">
                В этой папке пока пусто.<br>Нажмите «+», чтобы создать.
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-surface">
        <header class="h-16 border-b border-[var(--md-outline)] flex items-center px-2 justify-between">
            <button type="button" class="w-12 h-12 flex items-center justify-center md:hidden rounded-full hover:bg-black/5" aria-label="Меню">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center gap-1">
                <span id="save-status" class="text-xs text-outline italic mr-2">Готово</span>
                <button id="btn-preview" type="button" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5" aria-label="Показать превью" title="Превью (Ctrl+Enter)">
                    <i data-lucide="eye" class="w-5 h-5 text-outline"></i>
                </button>
                <button id="btn-delete-note" type="button" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5" aria-label="Удалить заметку" title="Удалить заметку">
                    <i data-lucide="trash-2" class="w-5 h-5 text-outline"></i>
                </button>
                <button type="button" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5" aria-label="Поиск" disabled>
                    <i data-lucide="search" class="w-5 h-5 text-outline"></i>
                </button>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto p-6 md:p-10 max-w-3xl mx-auto w-full">
            <div id="chip-palette" class="flex flex-wrap items-center gap-2 mb-4" style="display:none;"></div>
            <input id="note-title" type="text" placeholder="Заголовок заметки..." class="text-3xl font-bold mb-6">
            <textarea id="note-content" placeholder="Начните печатать свою мысль здесь..."></textarea>
            <div id="note-preview" class="markdown-body hidden"></div>
        </div>
    </main>

    <aside id="ai-panel" class="w-80 border-l border-[var(--md-outline)] bg-[var(--md-surface-variant)]">
        <div class="p-4 border-b border-[var(--md-outline)] flex items-center justify-between gap-2">
            <div class="font-bold text-sm text-outline uppercase flex items-center gap-2">
                <i data-lucide="sparkles" class="w-4 h-4 text-primary"></i> Gemini
            </div>
            <button id="btn-ai-close" type="button" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5" aria-label="Закрыть панель" title="Закрыть">
                <i data-lucide="x" class="w-5 h-5 text-outline"></i>
            </button>
        </div>
        <div id="ai-panel-empty" class="flex-1 p-4 text-sm text-outline italic flex items-center justify-center text-center">
            Нажмите на чип в тексте, чтобы запустить ассистента.
        </div>
        <div id="ai-panel-active" class="flex-1 flex-col p-4 gap-3 overflow-y-auto" style="display:none;">
            <div id="ai-prompt-title" class="font-bold text-primary text-lg"></div>
            <div id="ai-prompt-description" class="text-sm text-outline"></div>
            <div class="mt-2 pt-3 border-t border-[var(--md-outline)] text-xs italic text-outline">
                ⚡ Ответ ассистента появится в V1.4 — после подключения GAS-прокси к Gemini.
            </div>
        </div>
    </aside>

    <div id="ai-backdrop" class="hidden fixed inset-0 bg-black/50 z-40"></div>

    <script>
        'use strict';

        // === STATE ===
        const state = {
            notes: [],
            folders: [],
            activeId: null,
            activeFolderId: 'inbox',
            saveTimeout: null,
            saveStatus: 'idle',
            editorMode: 'edit',
            activePrompt: null,
            activePromptRawName: null,
            aiPanelOpen: false
        };

        // Временная заглушка. Будет заменена пользовательской библиотекой промптов
        // (roadmap). Контракт элемента: { id, name, icon, description }.
        const PROMPTS = [
            { id: 'coach',     name: 'Тренер',    icon: 'compass',     description: 'Задаёт вопросы, помогает развить мысль' },
            { id: 'analyst',   name: 'Аналитик',  icon: 'bar-chart-3', description: 'Структурирует, находит паттерны и связи' },
            { id: 'motivator', name: 'Мотиватор', icon: 'zap',         description: 'Фокусирует на действии, подбадривает' }
        ];

        const STORAGE_KEY = 'mai_notes';
        const FOLDERS_KEY = 'mai_folders';
        const LEGACY_TITLE_KEY = 'mai_title';
        const LEGACY_CONTENT_KEY = 'mai_content';

        // === DOM ELEMENTS ===
        const els = {
            notesList: document.getElementById('notes-list'),
            notesEmpty: document.getElementById('notes-empty'),
            notesSectionLabel: document.getElementById('notes-section-label'),
            foldersList: document.getElementById('folders-list'),
            btnNewNote: document.getElementById('btn-new-note'),
            btnNewFolder: document.getElementById('btn-new-folder'),
            btnDeleteNote: document.getElementById('btn-delete-note'),
            btnPreview: document.getElementById('btn-preview'),
            titleInput: document.getElementById('note-title'),
            contentInput: document.getElementById('note-content'),
            preview: document.getElementById('note-preview'),
            statusText: document.getElementById('save-status'),
            chipPalette: document.getElementById('chip-palette'),
            aiPanel: document.getElementById('ai-panel'),
            aiPanelEmpty: document.getElementById('ai-panel-empty'),
            aiPanelActive: document.getElementById('ai-panel-active'),
            aiPromptTitle: document.getElementById('ai-prompt-title'),
            aiPromptDescription: document.getElementById('ai-prompt-description'),
            btnAiClose: document.getElementById('btn-ai-close'),
            aiBackdrop: document.getElementById('ai-backdrop')
        };

        // === UTILS ===
        function genId() {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
                try { return crypto.randomUUID(); } catch (_) { /* fallback ниже */ }
            }
            return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function relativeTime(ts) {
            const diff = Date.now() - ts;
            if (diff < 60 * 1000) return 'только что';
            if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + ' мин назад';
            if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + ' ч назад';
            if (diff < 48 * 60 * 60 * 1000) return 'вчера';
            return new Date(ts).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        function getNoteById(id) {
            if (!id) return null;
            return state.notes.find(function (n) { return n.id === id; }) || null;
        }

        function isValidNote(n) {
            return n && typeof n === 'object'
                && typeof n.id === 'string'
                && typeof n.title === 'string'
                && typeof n.content === 'string'
                && typeof n.updatedAt === 'number'
                && (n.tags === undefined || Array.isArray(n.tags))
                && (n.folderId === undefined || typeof n.folderId === 'string');
        }

        function sortedNotes() {
            return state.notes.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; });
        }

        function notesInFolder(folderId) {
            return state.notes
                .filter(function (n) { return n.folderId === folderId; })
                .sort(function (a, b) { return b.updatedAt - a.updatedAt; });
        }

        function autoResizeTextarea() {
            const ta = els.contentInput;
            if (!ta || ta.classList.contains('hidden')) return;
            ta.style.height = 'auto';
            const max = Math.max(200, window.innerHeight * 0.6);
            ta.style.height = Math.min(ta.scrollHeight, max) + 'px';
        }

        function notePreview(note) {
            const firstLine = note.content.trim().split('\n')[0].trim();
            return firstLine ? firstLine.slice(0, 60) : 'Пустая заметка';
        }

        function noteTitle(note) {
            return note.title.trim() ? note.title : 'Без названия';
        }

        function makeDefaultFolder() {
            return { id: 'inbox', name: 'Входящие', updatedAt: Date.now() };
        }

        // === STORAGE — NOTES ===
        function loadNotes() {
            let raw = null;
            try {
                raw = localStorage.getItem(STORAGE_KEY);
            } catch (e) {
                console.warn('localStorage недоступен (read):', e);
                return [];
            }

            if (raw !== null) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        return parsed
                            .filter(isValidNote)
                            .map(function (n) {
                                return {
                                    id: n.id,
                                    title: n.title,
                                    content: n.content,
                                    updatedAt: n.updatedAt,
                                    tags: Array.isArray(n.tags) ? n.tags : [],
                                    folderId: typeof n.folderId === 'string' ? n.folderId : 'inbox'
                                };
                            });
                    }
                } catch (e) {
                    console.warn('Повреждён ' + STORAGE_KEY + ', восстанавливаюсь:', e);
                }
                return [];
            }

            let legacyTitle = '';
            let legacyContent = '';
            try {
                legacyTitle = localStorage.getItem(LEGACY_TITLE_KEY) || '';
                legacyContent = localStorage.getItem(LEGACY_CONTENT_KEY) || '';
            } catch (e) {
                return [];
            }

            if (legacyTitle || legacyContent) {
                return [{
                    id: genId(),
                    title: legacyTitle || 'Без названия',
                    content: legacyContent,
                    updatedAt: Date.now(),
                    tags: [],
                    folderId: 'inbox'
                }];
            }

            return [];
        }

        function persistNotes() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes));
                return true;
            } catch (e) {
                console.error('persistNotes failed:', e);
                state.saveStatus = 'error';
                return false;
            }
        }

        // === STORAGE — FOLDERS ===
        function loadFolders() {
            let raw = null;
            try {
                raw = localStorage.getItem(FOLDERS_KEY);
            } catch (e) {
                return [makeDefaultFolder()];
            }

            if (raw !== null) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        const valid = parsed
                            .filter(function (f) {
                                return f && typeof f === 'object'
                                    && typeof f.id === 'string'
                                    && typeof f.name === 'string'
                                    && typeof f.updatedAt === 'number';
                            })
                            .map(function (f) {
                                return { id: f.id, name: f.name, updatedAt: f.updatedAt };
                            });
                        if (!valid.some(function (f) { return f.id === 'inbox'; })) {
                            valid.unshift(makeDefaultFolder());
                        }
                        return valid;
                    }
                } catch (e) {
                    console.warn('Повреждён ' + FOLDERS_KEY + ', восстанавливаюсь:', e);
                }
                return [makeDefaultFolder()];
            }

            return [makeDefaultFolder()];
        }

        function persistFolders() {
            try {
                localStorage.setItem(FOLDERS_KEY, JSON.stringify(state.folders));
                return true;
            } catch (e) {
                console.error('persistFolders failed:', e);
                return false;
            }
        }

        function validateFolderRefs() {
            const ids = new Set(state.folders.map(function (f) { return f.id; }));
            let changed = false;
            state.notes.forEach(function (n) {
                if (!ids.has(n.folderId)) {
                    n.folderId = 'inbox';
                    changed = true;
                }
            });
            if (changed) persistNotes();
        }

        // === FOLDERS ===
        function getFolderById(id) {
            if (!id) return null;
            return state.folders.find(function (f) { return f.id === id; }) || null;
        }

        function sortedFolders() {
            return state.folders.slice().sort(function (a, b) {
                if (a.id === 'inbox') return -1;
                if (b.id === 'inbox') return 1;
                return a.name.localeCompare(b.name, 'ru');
            });
        }

        function folderNotesCount(folderId) {
            return state.notes.filter(function (n) { return n.folderId === folderId; }).length;
        }

        function createFolder() {
            const raw = window.prompt('Название папки:');
            if (raw === null) return;
            const name = raw.trim();
            if (!name) return;
            if (name.length > 60) { window.alert('Слишком длинное имя (макс. 60)'); return; }
            const dup = state.folders.some(function (f) {
                return f.name.toLowerCase() === name.toLowerCase();
            });
            if (dup) { window.alert('Папка с таким именем уже есть'); return; }

            const folder = { id: genId(), name: name, updatedAt: Date.now() };
            state.folders.push(folder);
            persistFolders();
            renderFolders();
        }

        function renameFolder(id) {
            if (id === 'inbox') return;
            const folder = getFolderById(id);
            if (!folder) return;
            const raw = window.prompt('Новое имя папки:', folder.name);
            if (raw === null) return;
            const name = raw.trim();
            if (!name) return;
            if (name.length > 60) { window.alert('Слишком длинное имя (макс. 60)'); return; }
            const dup = state.folders.some(function (f) {
                return f.id !== id && f.name.toLowerCase() === name.toLowerCase();
            });
            if (dup) { window.alert('Папка с таким именем уже есть'); return; }

            folder.name = name;
            folder.updatedAt = Date.now();
            persistFolders();
            renderFolders();
            renderNotesSectionLabel();
        }

        function deleteFolder(id) {
            if (id === 'inbox') return;
            const folder = getFolderById(id);
            if (!folder) return;

            const count = folderNotesCount(id);
            const msg = count > 0
                ? 'Удалить папку «' + folder.name + '»? ' + count + ' заметок переместятся в «Входящие».'
                : 'Удалить папку «' + folder.name + '»?';
            if (!window.confirm(msg)) return;

            state.notes.forEach(function (n) {
                if (n.folderId === id) n.folderId = 'inbox';
            });
            state.folders = state.folders.filter(function (f) { return f.id !== id; });

            if (state.activeFolderId === id) {
                state.activeFolderId = 'inbox';
                const candidates = notesInFolder('inbox');
                state.activeId = candidates.length > 0 ? candidates[0].id : null;
            } else {
                const note = getNoteById(state.activeId);
                if (!note) state.activeId = null;
            }

            state.editorMode = 'edit';
            persistFolders();
            persistNotes();
            renderAll();
        }

        function selectFolder(id) {
            if (id === state.activeFolderId) return;
            if (!getFolderById(id)) return;

            state.activeFolderId = id;
            state.editorMode = 'edit';
            resetAIPanel();

            const candidates = notesInFolder(id);
            state.activeId = candidates.length > 0 ? candidates[0].id : null;

            renderAll();
        }

        // === PROMPTS ===
        function getPromptById(id) {
            if (!id) return null;
            return PROMPTS.find(function (p) { return p.id === id; }) || null;
        }

        function getPromptByName(name) {
            if (!name) return null;
            const lower = String(name).toLowerCase();
            return PROMPTS.find(function (p) { return p.name.toLowerCase() === lower; }) || null;
        }

        // === CHIP PALETTE ===
        function renderChipPalette() {
            if (!els.chipPalette) return;
            if (!state.activeId || state.editorMode === 'preview') {
                els.chipPalette.style.display = 'none';
                return;
            }
            els.chipPalette.style.display = 'flex';
            els.chipPalette.innerHTML = PROMPTS.map(function (p) {
                return '<button type="button" '
                    + 'class="prompt-chip-palette-btn" '
                    + 'data-prompt-insert="' + escapeHtml(p.name) + '" '
                    + 'title="Вставить чип ' + escapeHtml(p.name) + '">'
                    + '<i data-lucide="' + escapeHtml(p.icon) + '" class="w-3.5 h-3.5"></i>'
                    + '<span>' + escapeHtml(p.name) + '</span>'
                    + '</button>';
            }).join('');
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        function insertChipAtCursor(promptName) {
            if (!state.activeId) return;
            if (state.editorMode === 'preview') exitPreviewMode();

            const ta = els.contentInput;
            const chip = '[!prompt:' + promptName + ']';
            const value = ta.value;
            let start = ta.selectionStart;
            let end = ta.selectionEnd;
            if (typeof start !== 'number') start = value.length;
            if (typeof end !== 'number') end = value.length;

            ta.value = value.slice(0, start) + chip + value.slice(end);
            const pos = start + chip.length;
            try {
                ta.setSelectionRange(pos, pos);
                ta.focus();
            } catch (_) { /* noop */ }

            onEdit();
            autoResizeTextarea();
        }

        // === CHIP PARSER ===
        function renderPromptChipsInPreview() {
            if (!els.preview) return;
            const regex = /\[!prompt:([^\]\n]+)\]/g;

            const walker = document.createTreeWalker(
                els.preview,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode: function (node) {
                        if (node.parentElement && node.parentElement.closest('code, pre')) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        regex.lastIndex = 0;
                        if (!regex.test(node.nodeValue || '')) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );

            const textNodes = [];
            let n;
            while ((n = walker.nextNode())) textNodes.push(n);

            textNodes.forEach(function (textNode) {
                const text = textNode.nodeValue || '';
                const frag = document.createDocumentFragment();
                let lastIdx = 0;
                let match;
                regex.lastIndex = 0;
                while ((match = regex.exec(text)) !== null) {
                    if (match.index > lastIdx) {
                        frag.appendChild(document.createTextNode(text.slice(lastIdx, match.index)));
                    }
                    const rawName = match[1].trim();
                    const prompt = getPromptByName(rawName);

                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'prompt-chip';
                    chip.setAttribute('data-prompt-name', rawName);
                    if (prompt) chip.setAttribute('data-prompt-id', prompt.id);

                    if (prompt) {
                        const iconEl = document.createElement('i');
                        iconEl.setAttribute('data-lucide', prompt.icon);
                        iconEl.className = 'w-3.5 h-3.5';
                        chip.appendChild(iconEl);
                    }
                    const label = document.createElement('span');
                    label.textContent = rawName;
                    chip.appendChild(label);

                    frag.appendChild(chip);
                    lastIdx = match.index + match[0].length;
                }
                if (lastIdx < text.length) {
                    frag.appendChild(document.createTextNode(text.slice(lastIdx)));
                }
                if (textNode.parentNode) {
                    textNode.parentNode.replaceChild(frag, textNode);
                }
            });

            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        // === AI PANEL ===
        function openPromptPanel(promptId, rawName) {
            state.activePrompt = promptId || null;
            state.activePromptRawName = rawName || null;
            state.aiPanelOpen = true;
            updateAIPanel();
        }

        function closePromptPanel() {
            state.activePrompt = null;
            state.activePromptRawName = null;
            state.aiPanelOpen = false;
            updateAIPanel();
        }

        function resetAIPanel() {
            state.activePrompt = null;
            state.activePromptRawName = null;
            state.aiPanelOpen = false;
            updateAIPanel();
        }

        function updateAIPanel() {
            if (!els.aiPanel) return;
            const prompt = getPromptById(state.activePrompt);
            const rawName = state.activePromptRawName;
            const hasActive = !!prompt || !!rawName;

            if (hasActive) {
                els.aiPanelEmpty.style.display = 'none';
                els.aiPanelActive.style.display = 'flex';
                els.aiPromptTitle.textContent = prompt ? prompt.name : (rawName || 'Неизвестный промпт');
                els.aiPromptDescription.textContent = prompt
                    ? prompt.description
                    : 'Такого промпта нет в библиотеке';
            } else {
                els.aiPanelEmpty.style.display = 'flex';
                els.aiPanelActive.style.display = 'none';
            }

            const isMobile = window.innerWidth < 1024;
            if (isMobile && state.aiPanelOpen && hasActive) {
                els.aiPanel.classList.add('mobile-active');
                els.aiBackdrop.classList.remove('hidden');
            } else {
                els.aiPanel.classList.remove('mobile-active');
                els.aiBackdrop.classList.add('hidden');
            }

            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        // === MARKDOWN ===
        function renderMarkdown(text) {
            if (!text || !text.trim()) {
                els.preview.innerHTML = '';
                return;
            }

            if (typeof window.marked === 'undefined' || typeof window.DOMPurify === 'undefined') {
                els.preview.innerHTML = '<p>' + escapeHtml(text) + '</p>';
                renderPromptChipsInPreview();
                return;
            }

            try {
                const rawHtml = window.marked.parse(text, { gfm: true, breaks: true });
                const cleanHtml = window.DOMPurify.sanitize(rawHtml);
                els.preview.innerHTML = cleanHtml;

                els.preview.querySelectorAll('a').forEach(function (a) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                });

                makeCheckboxesInteractive();
                renderPromptChipsInPreview();
            } catch (e) {
                console.error('Markdown render error:', e);
                els.preview.innerHTML = '<p>' + escapeHtml(text) + '</p>';
                renderPromptChipsInPreview();
            }
        }

        function makeCheckboxesInteractive() {
            const note = getNoteById(state.activeId);
            if (!note) return;

            const lines = note.content.split('\n');
            const taskLineIndices = [];
            for (let i = 0; i < lines.length; i++) {
                if (/^\s*[-*+]\s+\[[ xX]\]/.test(lines[i])) {
                    taskLineIndices.push(i);
                }
            }

            const checkboxes = els.preview.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(function (cb, i) {
                cb.removeAttribute('disabled');
                if (i >= taskLineIndices.length) return;

                const lineIdx = taskLineIndices[i];

                cb.addEventListener('change', function () {
                    const current = getNoteById(state.activeId);
                    if (!current) return;

                    const currLines = current.content.split('\n');
                    if (lineIdx >= currLines.length) return;

                    const line = currLines[lineIdx];
                    const newLine = cb.checked
                        ? line.replace(/\[ \]/, '[x]')
                        : line.replace(/\[[xX]\]/, '[ ]');

                    if (newLine === line) return;

                    currLines[lineIdx] = newLine;
                    current.content = currLines.join('\n');
                    current.updatedAt = Date.now();

                    state.saveStatus = 'saving';
                    renderSaveStatus();
                    scheduleSave();
                });
            });
        }

        // === PREVIEW / EDIT MODE ===
        function enterPreviewMode() {
            const note = getNoteById(state.activeId);
            if (!note) return;
            if (!note.content.trim()) return;
            if (state.editorMode === 'preview') return;
            state.editorMode = 'preview';
            renderEditor();
        }

        function exitPreviewMode() {
            if (state.editorMode !== 'preview') return;
            state.editorMode = 'edit';
            renderEditor();
            try {
                els.contentInput.focus();
                const len = els.contentInput.value.length;
                els.contentInput.setSelectionRange(len, len);
            } catch (_) { /* noop */ }
        }

        function togglePreviewMode() {
            if (state.editorMode === 'preview') {
                exitPreviewMode();
            } else {
                enterPreviewMode();
            }
        }

        function schedulePreview(noteIdAtBlur) {
            setTimeout(function () {
                if (state.activeId !== noteIdAtBlur) return;
                if (state.editorMode === 'preview') return;
                const active = document.activeElement;
                if (active === els.contentInput) return;
                if (active === els.btnPreview) return;
                if (active && els.preview.contains(active)) return;
                enterPreviewMode();
            }, 50);
        }

        // === RENDER ===
        function renderFolders() {
            if (!els.foldersList) return;
            const sorted = sortedFolders();
            const html = sorted.map(function (folder) {
                const isActive = folder.id === state.activeFolderId;
                const isInbox = folder.id === 'inbox';
                const count = folderNotesCount(folder.id);
                const icon = isInbox ? 'inbox' : 'folder';
                const activeCls = isActive ? 'folder-item-active' : '';

                let actions = '';
                if (!isInbox && isActive) {
                    actions = '<button type="button" class="folder-action-btn w-8 h-8 items-center justify-center rounded-full hover:bg-black/10" data-folder-action="edit" aria-label="Переименовать" title="Переименовать"><i data-lucide="pencil" class="w-3.5 h-3.5 text-outline"></i></button>'
                        + '<button type="button" class="folder-action-btn w-8 h-8 items-center justify-center rounded-full hover:bg-black/10" data-folder-action="delete" aria-label="Удалить" title="Удалить"><i data-lucide="trash-2" class="w-3.5 h-3.5 text-outline"></i></button>';
                }

                return '<div class="folder-item ' + activeCls + ' flex items-center gap-1" data-folder-id="' + escapeHtml(folder.id) + '">'
                    + '<button type="button" class="folder-select-btn flex-1 flex items-center gap-2 p-2.5 min-h-[44px] text-left" data-folder-select="' + escapeHtml(folder.id) + '">'
                    + '<i data-lucide="' + icon + '" class="w-4 h-4 flex-shrink-0 text-outline"></i>'
                    + '<span class="folder-name flex-1 truncate text-sm text-outline">' + escapeHtml(folder.name) + '</span>'
                    + '<span class="folder-count text-xs opacity-60 text-outline">' + count + '</span>'
                    + '</button>'
                    + actions
                    + '</div>';
            }).join('');

            els.foldersList.innerHTML = html;

            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        function renderNotesSectionLabel() {
            if (!els.notesSectionLabel) return;
            const folder = getFolderById(state.activeFolderId);
            els.notesSectionLabel.textContent = folder ? 'Заметки: ' + folder.name : 'Заметки';
        }

        function renderNotes() {
            const sorted = notesInFolder(state.activeFolderId);

            if (sorted.length === 0) {
                els.notesList.innerHTML = '';
                els.notesList.style.display = 'none';
                els.notesEmpty.style.display = 'flex';
                return;
            }

            els.notesEmpty.style.display = 'none';
            els.notesList.style.display = 'flex';

            const html = sorted.map(function (note) {
                const isActive = note.id === state.activeId;
                const activeCls = isActive
                    ? 'bg-black/5 text-primary font-semibold'
                    : 'text-outline hover:bg-black/5';

                return '<button type="button" '
                    + 'class="note-item w-full text-left p-3 min-h-[48px] rounded-lg transition-colors ' + activeCls + '" '
                    + 'data-note-id="' + escapeHtml(note.id) + '">'
                    + '<div class="font-medium truncate text-sm">' + escapeHtml(noteTitle(note)) + '</div>'
                    + '<div class="text-xs truncate opacity-80 mt-0.5">' + escapeHtml(notePreview(note)) + '</div>'
                    + '<div class="text-[10px] opacity-60 mt-1">' + relativeTime(note.updatedAt) + '</div>'
                    + '</button>';
            }).join('');

            els.notesList.innerHTML = html;

            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        function updateActiveNoteInList() {
            if (!state.activeId) return;
            const note = getNoteById(state.activeId);
            if (!note) return;
            const btn = els.notesList.querySelector('[data-note-id="' + state.activeId + '"]');
            if (!btn || btn.children.length < 3) return;

            btn.children[0].textContent = noteTitle(note);
            btn.children[1].textContent = notePreview(note);
            btn.children[2].textContent = relativeTime(note.updatedAt);
        }

        function updatePreviewButton() {
            if (!els.btnPreview) return;
            const isPreview = state.editorMode === 'preview';
            els.btnPreview.innerHTML = isPreview
                ? '<i data-lucide="pencil" class="w-5 h-5 text-primary"></i>'
                : '<i data-lucide="eye" class="w-5 h-5 text-outline"></i>';
            els.btnPreview.setAttribute('aria-label', isPreview ? 'Редактировать' : 'Показать превью');
            els.btnPreview.setAttribute('title', isPreview ? 'Редактировать (Ctrl+Enter)' : 'Превью (Ctrl+Enter)');
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        function renderEditor() {
            const note = getNoteById(state.activeId);

            if (!note) {
                state.editorMode = 'edit';
                els.titleInput.value = '';
                els.contentInput.value = '';
                els.titleInput.placeholder = 'Выберите заметку или создайте новую';
                els.contentInput.placeholder = 'Здесь появится текст заметки...';
                els.contentInput.classList.remove('hidden');
                els.preview.classList.add('hidden');
                els.preview.innerHTML = '';
                autoResizeTextarea();
                updatePreviewButton();
                renderChipPalette();
                updateAIPanel();
                return;
            }

            els.titleInput.value = note.title;
            els.contentInput.value = note.content;
            els.titleInput.placeholder = 'Заголовок заметки...';
            els.contentInput.placeholder = 'Начните печатать свою мысль здесь...';

            if (state.editorMode === 'preview') {
                els.contentInput.classList.add('hidden');
                els.preview.classList.remove('hidden');
                renderMarkdown(note.content);
            } else {
                els.contentInput.classList.remove('hidden');
                els.preview.classList.add('hidden');
                els.preview.innerHTML = '';
                autoResizeTextarea();
            }

            updatePreviewButton();
            renderChipPalette();
            updateAIPanel();
        }

        function renderSaveStatus() {
            const map = {
                idle:   { text: 'Готово',            color: 'var(--md-outline)' },
                saving: { text: 'Сохранение...',     color: 'var(--md-primary)' },
                saved:  { text: 'Сохранено',         color: 'var(--md-outline)' },
                error:  { text: 'Ошибка сохранения', color: '#B3261E' }
            };
            const s = map[state.saveStatus] || map.idle;
            els.statusText.innerText = s.text;
            els.statusText.style.color = s.color;
        }

        function renderAll() {
            renderFolders();
            renderNotesSectionLabel();
            renderNotes();
            renderEditor();
            renderSaveStatus();
        }

        // === LOGIC ===
        function scheduleSave() {
            if (state.saveTimeout) clearTimeout(state.saveTimeout);
            state.saveTimeout = setTimeout(function () {
                state.saveTimeout = null;
                const ok = persistNotes();
                if (ok) state.saveStatus = 'saved';
                renderSaveStatus();
            }, 500);
        }

        function onEdit() {
            if (!state.activeId) return;
            const note = getNoteById(state.activeId);
            if (!note) return;

            note.title = els.titleInput.value;
            note.content = els.contentInput.value;
            note.updatedAt = Date.now();

            state.saveStatus = 'saving';
            renderSaveStatus();
            scheduleSave();
        }

        function createNote() {
            const note = {
                id: genId(),
                title: '',
                content: '',
                updatedAt: Date.now(),
                tags: [],
                folderId: state.activeFolderId || 'inbox'
            };
            state.notes.unshift(note);
            state.activeId = note.id;
            state.editorMode = 'edit';
            resetAIPanel();

            const ok = persistNotes();
            if (ok) state.saveStatus = 'idle';

            renderAll();
            try { els.titleInput.focus(); } catch (_) { /* noop */ }
        }

        function selectNote(id) {
            if (id === state.activeId) {
                if (state.editorMode === 'preview') exitPreviewMode();
                return;
            }
            if (!getNoteById(id)) return;

            state.activeId = id;
            state.editorMode = 'edit';
            state.saveStatus = 'idle';
            resetAIPanel();
            renderAll();
        }

        function deleteNote(id) {
            const note = getNoteById(id);
            if (!note) return;

            const label = noteTitle(note);
            if (!window.confirm('Удалить заметку «' + label + '»?')) return;

            const folderIdOfNote = note.folderId;
            state.notes = state.notes.filter(function (n) { return n.id !== id; });

            if (state.activeId === id) {
                const candidates = notesInFolder(folderIdOfNote);
                state.activeId = candidates.length > 0 ? candidates[0].id : null;
            }

            state.editorMode = 'edit';
            resetAIPanel();
            const ok = persistNotes();
            if (ok) state.saveStatus = 'idle';

            renderAll();
        }

        // === BOOTSTRAP ===
        function attachListeners() {
            els.btnNewNote.addEventListener('click', createNote);
            els.btnNewFolder.addEventListener('click', createFolder);
            els.btnPreview.addEventListener('click', togglePreviewMode);

            els.btnDeleteNote.addEventListener('click', function () {
                if (state.activeId) deleteNote(state.activeId);
            });

            els.notesList.addEventListener('click', function (e) {
                const btn = e.target.closest('[data-note-id]');
                if (!btn) return;
                selectNote(btn.getAttribute('data-note-id'));
            });

            els.foldersList.addEventListener('click', function (e) {
                const actionBtn = e.target.closest('[data-folder-action]');
                if (actionBtn) {
                    e.stopPropagation();
                    const folderItem = actionBtn.closest('[data-folder-id]');
                    if (!folderItem) return;
                    const id = folderItem.getAttribute('data-folder-id');
                    const action = actionBtn.getAttribute('data-folder-action');
                    if (action === 'edit') renameFolder(id);
                    else if (action === 'delete') deleteFolder(id);
                    return;
                }

                const selectBtn = e.target.closest('[data-folder-select]');
                if (selectBtn) {
                    const id = selectBtn.getAttribute('data-folder-select');
                    selectFolder(id);
                    return;
                }
            });

            els.titleInput.addEventListener('input', onEdit);
            els.contentInput.addEventListener('input', function () {
                autoResizeTextarea();
                onEdit();
            });

            els.titleInput.addEventListener('blur', function () {
                updateActiveNoteInList();
            });
            els.contentInput.addEventListener('blur', function () {
                updateActiveNoteInList();
                schedulePreview(state.activeId);
            });

            els.preview.addEventListener('click', function (e) {
                const t = e.target;
                if (!t || typeof t.closest !== 'function') return;

                const chip = t.closest('[data-prompt-name]');
                if (chip) {
                    e.preventDefault();
                    const rawName = chip.getAttribute('data-prompt-name');
                    const prompt = getPromptByName(rawName);
                    openPromptPanel(prompt ? prompt.id : null, rawName);
                    return;
                }

                if (t.closest('a') || t.closest('input') || t.closest('button')) return;
                exitPreviewMode();
            });

            els.chipPalette.addEventListener('click', function (e) {
                const btn = e.target.closest('[data-prompt-insert]');
                if (!btn) return;
                insertChipAtCursor(btn.getAttribute('data-prompt-insert'));
            });

            els.btnAiClose.addEventListener('click', closePromptPanel);
            els.aiBackdrop.addEventListener('click', closePromptPanel);

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    if (state.aiPanelOpen) {
                        e.preventDefault();
                        closePromptPanel();
                        return;
                    }
                    if (state.editorMode === 'preview') {
                        e.preventDefault();
                        exitPreviewMode();
                        return;
                    }
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    togglePreviewMode();
                }
            });

            window.addEventListener('resize', function () {
                autoResizeTextarea();
                updateAIPanel();
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('./sw.js')
                        .then(function (reg) { console.log('✅ SW MAi зарегистрирован:', reg.scope); })
                        .catch(function (err) { console.error('❌ Ошибка SW:', err); });
                });
            }
        }

        function init() {
            state.folders = loadFolders();
            persistFolders(); // гарантируем наличие inbox в хранилище

            state.notes = loadNotes();
            validateFolderRefs();

            try {
                if (state.notes.length > 0 && localStorage.getItem(STORAGE_KEY) === null) {
                    persistNotes();
                }
            } catch (_) { /* noop */ }

            state.activeFolderId = 'inbox';
            const candidates = notesInFolder('inbox');
            state.activeId = candidates.length > 0 ? candidates[0].id : null;

            state.editorMode = 'edit';
            state.activePrompt = null;
            state.activePromptRawName = null;
            state.aiPanelOpen = false;

            renderAll();
            attachListeners();
            updateAIPanel();

            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        init();
    </script>
</body>
