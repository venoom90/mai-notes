<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zettel AI</title>
    
    <!-- Иконка сайта (эмодзи) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

    <!-- Material 3 (Tailwind CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Иконки -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --md-surface: #FEF7FF;
            --md-surface-variant: #E7E0EC;
            --md-primary: #6750A4;
            --md-on-primary: #FFFFFF;
            --md-on-surface: #1D1B20;
            --md-outline: #79747E;
            background-color: var(--md-surface);
            color: var(--md-on-surface);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --md-surface: #141218;
                --md-surface-variant: #49454F;
                --md-primary: #D0BCFF;
                --md-on-primary: #381E72;
                --md-on-surface: #E6E0E9;
                --md-outline: #938F99;
            }
        }
        body { margin: 0; height: 100vh; display: flex; overflow: hidden; }
        .bg-surface { background-color: var(--md-surface); }
        .bg-surface-variant { background-color: var(--md-surface-variant); }
        .bg-primary { background-color: var(--md-primary); color: var(--md-on-primary); }
        .text-primary { color: var(--md-primary); }
        .text-outline { color: var(--md-outline); }
        .border-outline { border-color: var(--md-outline); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: 10px; }

        /* Стили для полей ввода */
        input, textarea {
            background: transparent;
            border: none;
            outline: none;
            color: var(--md-on-surface);
            width: 100%;
            font-family: inherit;
        }
        input::placeholder, textarea::placeholder {
            color: var(--md-outline);
            opacity: 0.5;
        }
        textarea {
            resize: none;
            height: calc(100vh - 200px); /* Занимает оставшееся место */
            line-height: 1.6;
        }
    </style>

    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-surface text-[var(--md-on-surface)]">

    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <aside class="w-64 border-r border-[var(--md-outline)] flex-col hidden md:flex bg-[var(--md-surface-variant)]" style="opacity: 0.3; border-right-width: 1px;">
        <div class="p-4 flex justify-between items-center">
            <span class="font-bold text-lg text-primary">Zettel AI</span>
            <i data-lucide="settings" class="w-5 h-5 cursor-pointer text-outline"></i>
        </div>
        <div class="p-4 flex-1 overflow-y-auto">
            <button class="w-full flex items-center justify-center gap-2 bg-primary p-2.5 rounded-xl mb-6 font-medium shadow-sm hover:opacity-90 transition-opacity">
                <i data-lucide="plus" class="w-4 h-4"></i> Новая заметка
            </button>
            <div class="text-xs font-bold text-outline uppercase tracking-wider mb-2">Папки</div>
            
            <!-- Активная папка "Входящие" -->
            <div class="flex items-center gap-3 p-2 text-sm bg-black/5 rounded-lg cursor-pointer font-medium text-primary">
                <i data-lucide="file-text" class="w-4 h-4"></i> Входящие
            </div>
            <div class="flex items-center gap-3 p-2 text-sm hover:bg-black/5 rounded-lg cursor-pointer text-outline">
                <i data-lucide="hash" class="w-4 h-4"></i> #проект_Х
            </div>
        </div>
    </aside>

    <!-- ЦЕНТР (Редактор) -->
    <main class="flex-1 flex flex-col min-w-0 bg-surface">
        <!-- Шапка редактора -->
        <header class="h-16 border-b border-[var(--md-outline)] flex items-center px-4 justify-between md:justify-end" style="border-bottom-width: 1px; opacity: 0.5;">
            <i data-lucide="menu" class="w-6 h-6 md:hidden cursor-pointer"></i>
            <div class="flex items-center gap-3">
                <span id="save-status" class="text-xs text-outline italic">Готово</span>
                <i data-lucide="search" class="w-5 h-5 cursor-pointer text-outline"></i>
            </div>
        </header>

        <!-- Зона ввода текста -->
        <div class="flex-1 overflow-y-auto p-6 md:p-10 max-w-3xl mx-auto w-full">
            <input 
                id="note-title" 
                type="text" 
                placeholder="Заголовок заметки..." 
                class="text-3xl font-bold mb-6"
            >
            <textarea 
                id="note-content" 
                placeholder="Начните печатать свою мысль здесь... (поддерживается Markdown)"
            ></textarea>
        </div>
    </main>

    <!-- ПРАВАЯ ПАНЕЛЬ (ИИ) -->
    <aside class="w-80 border-l border-[var(--md-outline)] hidden lg:flex flex-col bg-[var(--md-surface-variant)]" style="opacity: 0.2; border-left-width: 1px;">
        <div class="p-4 border-b border-[var(--md-outline)] font-bold text-sm text-outline uppercase flex items-center gap-2" style="border-bottom-width: 1px;">
            <i data-lucide="sparkles" class="w-4 h-4 text-primary"></i> Gemini
        </div>
        <div class="flex-1 p-4 text-sm text-outline italic flex items-center justify-center text-center">
            Нажмите на чип, чтобы запустить ассистента.
        </div>
    </aside>

    <script>
        // Инициализация иконок
        lucide.createIcons();
        
        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }

        // --- ЛОГИКА СОХРАНЕНИЯ ТЕКСТА ---
        const titleInput = document.getElementById('note-title');
        const contentInput = document.getElementById('note-content');
        const statusText = document.getElementById('save-status');

        // 1. Загружаем сохраненные данные при открытии
        titleInput.value = localStorage.getItem('zettel_title') || '';
        contentInput.value = localStorage.getItem('zettel_content') || '';

        // 2. Функция автосохранения (с задержкой, чтобы не сохранять каждую букву)
        let saveTimeout;
        
        function autoSave() {
            statusText.innerText = 'Сохранение...';
            statusText.style.color = 'var(--md-primary)';
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('zettel_title', titleInput.value);
                localStorage.setItem('zettel_content', contentInput.value);
                
                statusText.innerText = 'Сохранено в память';
                statusText.style.color = 'var(--md-outline)';
            }, 500); // Сохраняем через 0.5 секунды после окончания печати
        }

        // 3. Слушаем ввод текста
        titleInput.addEventListener('input', autoSave);
        contentInput.addEventListener('input', autoSave);

        // Автоматическая подстройка высоты textarea под текст
        contentInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
